kind: agent
name: correctbench
control_loop:
  type: generate_validate_correct
stages:                         # mapping keyed by id; order is execution order
  generate:
    prompt: configs/prompts/generation/tb_from_spec.yaml
  validate:
    feedback: all               # whatever the experiment enables
  correct:
    prompts:
      - configs/prompts/correction/root_cause.yaml
      - configs/prompts/correction/apply_fix.yaml
context:
  strategy: full_history
tools: [simulator]
