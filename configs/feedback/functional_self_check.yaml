# CorrectBench-style: simulate the TB against an ensemble of LLM-generated RTL
# and flag scenarios that most implementations fail.
kind: feedback
name: functional_self_check
type: functional_self_check
tool: { name: iverilog, args: ["-g2012"] }
ensemble_size: 20
fail_threshold: 0.7
template: configs/prompts/feedback/self_check_report.yaml
