# Maps VerilogEval-Human files, e.g.
#   Prob042_vector2_prompt.txt / Prob042_vector2_ref.sv / Prob042_vector2_test.sv
# into the canonical designs/<suite>/<id>/ layout.
name: verilogeval
id_pattern: '^Prob\d+_(?P<id>.+?)_(?P<role>prompt|ref|test)\.(txt|sv|v)$'
roles:
  prompt: { dest: spec.md, field: spec }
  ref:    { dest: "rtl/{id}.sv", field: rtl }
  test:   { dest: "golden_tb/{id}_tb.sv", field: golden_tb }
top_module_from_rtl: true      # parse `module X` instead of trusting the filename
# Note: VerilogEval v2 names the reference module `RefModule` and the prompt
# asks for `TopModule`. Record both; `check` will flag the mismatch so we
# decide explicitly rather than silently.
module_aliases: { RefModule: TopModule }
