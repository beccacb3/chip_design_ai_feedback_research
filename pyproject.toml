[project]
name = "specfidelity"
version = "0.0.1"
description = "Config-driven framework for evaluating spec fidelity of agent-generated testbenches"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.scripts]
specfidelity = "specfidelity.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
